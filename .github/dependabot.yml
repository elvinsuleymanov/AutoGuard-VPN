version: 2

updates:
  # Auth service Python deps
  - package-ecosystem: pip
    directory: /auth
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - python
    groups:
      auth-deps:
        patterns: ["*"]

  # Docker base images, one entry per locally built Dockerfile
  - package-ecosystem: docker
    directory: /auth
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: /wireguard
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - docker

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
